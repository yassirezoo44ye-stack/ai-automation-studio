[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Real URL is injected at runtime by migrations/env.py from the DATABASE_URL env var.
# This placeholder value is never used.
sqlalchemy.url = postgresql://placeholder/placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Axon core schema (schema `axon`, applies init_db.sql): alembic -n axon upgrade head
[axon]
script_location = migrations_axon
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql://placeholder/placeholder
