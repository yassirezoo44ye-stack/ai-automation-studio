<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>الصفحة غير موجودة · Page not found — Flow</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #090909; color: #f2f2f2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 16px; }
    main { max-width: 420px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #b5b5b5; margin: 0 0 20px; line-height: 1.6; }
    a { display: inline-block; padding: 10px 20px; border-radius: 8px; background: #E0103A; color: #fff; text-decoration: none; font-weight: 600; margin: 4px; }
    a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>الصفحة غير موجودة</h1>
    <p>ربما تغيّر الرابط أو حُذفت الصفحة.</p>
    <h1 lang="en" dir="ltr">Page not found</h1>
    <p lang="en" dir="ltr">The link may have changed or the page was removed.</p>
    <a href="/ar">الصفحة الرئيسية</a>
    <a href="/en" lang="en">Home</a>
  </main>
</body>
</html>
