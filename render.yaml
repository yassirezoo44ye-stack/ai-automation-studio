services:
  - type: web
    name: ai-automation-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_TEAM
        sync: false
      - key: APP_URL
        sync: false
      # Google Sign-In (app/routers/auth_users.py's /api/auth/google +
      # /api/auth/google/callback) — both required together; the code reads
      # them as os.getenv(..., "") and returns a clean 503 ("... OAuth is
      # not configured on this server") when GOOGLE_CLIENT_ID is unset,
      # rather than failing to boot. See docs for the exact redirect URI
      # (<APP_URL>/api/auth/google/callback) to register in Google Cloud.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # GitHub Sign-In — optional, same graceful 503 as Google when unset.
      # Register a GitHub OAuth App; callback URI: <APP_URL>/api/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Microsoft Sign-In — optional, same graceful 503 as Google when unset.
      # Register an Azure App Registration; callback URI: <APP_URL>/api/auth/microsoft/callback
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      # Comma-separated additional CORS origins for the Vercel split-deploy.
      # Without this, the browser CORS preflight blocks all API calls from
      # the Vercel frontend to this Render backend.
      # Set to your Vercel deployment domain, e.g.:
      #   https://ai-automation-studio-kohl.vercel.app
      # If you have a custom domain on Vercel, include that instead/also.
      - key: EXTRA_CORS_ORIGINS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-studio-db
          property: connectionString
      - key: PORT
        value: "8000"

databases:
  - name: ai-studio-db
    plan: starter
    databaseName: aistudio
