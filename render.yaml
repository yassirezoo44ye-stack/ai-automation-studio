services:
  - type: web
    name: ai-automation-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_PRICE_ID_STARTER
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_TEAM
        sync: false
      - key: APP_URL
        sync: false
      # Google Sign-In (app/routers/auth_users.py's /api/auth/google +
      # /api/auth/google/callback) — both required together; the code reads
      # them as os.getenv(..., "") and returns a clean 503 ("... OAuth is
      # not configured on this server") when GOOGLE_CLIENT_ID is unset,
      # rather than failing to boot. See docs for the exact redirect URI
      # (<APP_URL>/api/auth/google/callback) to register in Google Cloud.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Comma-separated additional CORS origins for a split-frontend setup
      # (e.g. https://your-app.vercel.app) — set after your first Vercel
      # deploy once you know the assigned domain.
      - key: EXTRA_CORS_ORIGINS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-studio-db
          property: connectionString
      - key: PORT
        value: "8000"

databases:
  - name: ai-studio-db
    plan: starter
    databaseName: aistudio
