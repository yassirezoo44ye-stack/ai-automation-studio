[pytest]
asyncio_mode = auto
# Explicit, so pytest-asyncio does not warn on every run (the default it
# warns about is this same value).
asyncio_default_fixture_loop_scope = function
# Regression guards for BE-01/BE-02 (Flow audit): these warnings were
# driven to zero and must not come back.
filterwarnings =
    error:coroutine .* was never awaited:RuntimeWarning
    error:Setting per-request cookies=.*:DeprecationWarning
    # An un-awaited coroutine found at GC time surfaces via the
    # unraisable hook, so the RuntimeWarning filter alone cannot fail it.
    error::pytest.PytestUnraisableExceptionWarning
