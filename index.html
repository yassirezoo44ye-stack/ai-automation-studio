<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" />
  <meta name="description" content="Flow — AI-powered automation studio" />
  <!-- Opt out of browser auto-translate (Chrome, Edge, Google Translate extension) -->
  <meta name="google" content="notranslate" />
  <meta http-equiv="content-language" content="ar,en" />
  <title>Flow</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- Social sharing (WhatsApp, X, LinkedIn, Slack…) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Flow" />
  <meta property="og:title" content="Flow — AI Automation Studio" />
  <meta property="og:description" content="Design and run AI-powered workflows for your business." />
  <meta property="og:url" content="https://ai-automation-studio-kohl.vercel.app/" />
  <meta property="og:image" content="https://ai-automation-studio-kohl.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Flow — AI Automation Studio" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Flow — AI Automation Studio" />
  <meta name="twitter:description" content="Design and run AI-powered workflows for your business." />
  <meta name="twitter:image" content="https://ai-automation-studio-kohl.vercel.app/og-image.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; overflow: hidden; }
  </style>
  <script>
    // Sets data-theme (and a matching fallback background) synchronously,
    // before first paint — mirrors AppContext.tsx's getStoredTheme()/
    // applyTheme() exactly (same localStorage key, same OS-preference
    // fallback order) so there's no flash of the wrong theme's background
    // while React and design-system.css's [data-theme] rules load, for
    // ANY of the three themes, not just dark.
    (function () {
      var BG = { dark: "#0B1220", light: "#F5F6F8", "high-contrast": "#000000" };
      var t;
      try {
        t = localStorage.getItem("axon-theme");
        if (t !== "light" && t !== "dark" && t !== "high-contrast") {
          t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        }
      } catch (e) { t = "dark"; }
      var root = document.documentElement;
      root.setAttribute("data-theme", t);
      root.style.background = BG[t];
    })();
    // Sets lang/dir synchronously, before first paint — mirrors
    // LangContext.tsx's getStoredLang()/applyLang() exactly (same
    // localStorage key, same browser-language fallback) so an Arabic
    // reload never flashes an LTR layout before flipping to RTL.
    (function () {
      var l;
      try {
        l = localStorage.getItem("axon-lang");
        if (l !== "en" && l !== "ar") {
          l = (navigator.language || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
        }
      } catch (e) { l = "en"; }
      var root = document.documentElement;
      root.setAttribute("lang", l);
      root.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/renderer/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
