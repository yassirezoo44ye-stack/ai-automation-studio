name: Market Intelligence — paper simulation checks

on:
  pull_request:
    paths:
      - 'app/market_intelligence/**'
      - 'tests/test_market_intelligence_*.py'
      - '.github/workflows/market-intelligence-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-simulation:
    name: Paper simulation unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Check Python syntax
        run: python -m compileall -q app/market_intelligence tests/test_market_intelligence_*.py
      - name: Run isolated paper-simulation tests
        run: python -m pytest -q --noconftest tests/test_market_intelligence_simulator.py tests/test_market_intelligence_backtest.py tests/test_market_intelligence_historical_data.py tests/test_market_intelligence_reporting.py
