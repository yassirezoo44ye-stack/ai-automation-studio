name: BYOK isolated security tests
on:
  push:
    branches:
      - feature/free-tools-byok-local
    paths:
      - 'app/ai/compute_policy.py'
      - 'app/ai/user_credentials.py'
      - 'app/ai/credential_rotation.py'
      - 'app/ai/credential_access.py'
      - 'app/ai/credential_rls.py'
      - 'tests/ai/test_compute_policy.py'
      - 'tests/ai/test_user_credentials.py'
      - 'tests/ai/test_credential_rotation.py'
      - 'tests/ai/test_credential_access.py'
      - 'tests/ai/test_credential_rls.py'
      - 'tests/ai/test_byok_encryption_config.py'
      - 'tests/ai/test_byok_postgres_integration.py'
      - 'tests/ai/conftest.py'
      - '.github/workflows/byok-security.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/ai/**'
      - 'tests/ai/test_byok_*.py'
      - 'tests/ai/test_credential_*.py'
      - 'tests/ai/test_compute_policy.py'
      - 'tests/ai/test_user_credentials.py'
      - 'tests/ai/conftest.py'
      - '.github/workflows/byok-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install isolated test dependencies
        run: python -m pip install pytest pytest-asyncio cryptography fastapi asyncpg pydantic PyJWT
      - name: Run BYOK tests
        run: |
          python -m pytest -q --confcutdir=tests/ai \
            tests/ai/test_compute_policy.py \
            tests/ai/test_user_credentials.py \
            tests/ai/test_byok_encryption_config.py \
            tests/ai/test_credential_access.py \
            tests/ai/test_credential_rls.py \
            tests/ai/test_credential_rotation.py

  postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: byok_isolation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d byok_isolation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: .
      BYOK_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/byok_isolation
      BYOK_TEST_APP_DATABASE_URL: postgresql://byok_app:ci-app-password@localhost:5432/byok_isolation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio asyncpg cryptography fastapi
      - name: Create restricted database role
        run: |
          python - <<'PY'
          import asyncio, asyncpg, os
          async def main():
              conn = await asyncpg.connect(os.environ["BYOK_TEST_DATABASE_URL"])
              try:
                  await conn.execute("CREATE ROLE byok_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE")
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
      - name: Run real PostgreSQL isolation tests
        run: python -m pytest -q --confcutdir=tests/ai tests/ai/test_byok_postgres_integration.py
